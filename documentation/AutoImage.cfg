[ILOMs] # -------------- Obtain MAC Addresses using ipmiTool --------- #

# Switch to use ipmitool in place of the paramiko ssh method for 
# obtaining MAC addresses.  Also used for PXE set/reset commands.
#
# 1 = ON  - Use ipmiTool
# 0 = OFF - Do not use ipmiTool
#
# NOTE: It may be necessary to turn this off for manualMAC mode to
#       function properly.

USEipmiTool: 1 
ipmitool: oraipmitool
# ipmitool: ipmitool
# ipmitool: /usr/sbin/oraipmitool
# ipmitool: /usr/bin/ipmitool
# ipmitool: /usr/bin/oraipmitool


[debug] # ------------------------ Debug Mode ------------------------ #
#
# Setting LOGMODE will build an image of the console log in AutoImage.log
#
# Setting DEBUGMODE will create a large trace file (AutoImage.trc) with  
# a lot of debug information.  Please set DEBUGMODE if you are running  
# into any problems and send it to john.hoelscher@oracle.com for analysis.
#
# 1 = Mode is On (Default)
# 0 = Mode is Off 
LOGMODE: 1
DEBUGMODE: 1
