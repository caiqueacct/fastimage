#----------------------------------------------------------------------#
#------------ AutoImage 4.0 Advanced Configuration Options ------------#
#----------------------------------------------------------------------#

[manual] # ----------------------- Manual Mode ----------------------- #

# This can be used in the following situations.
# 1)  No Operating System on the Nodes
# 2)  Nodes have existing IPs which are not factory
# 3)  Nodes are in an unreachable or inconsistent state
# 4)  Nodes are otherwise unreachable
#
# Please note, this will limit the ability to automate the MAC address
# collection and to automate the PXE configuration system reboot. 
#
# To use this mode, set the manualMac configuration to '1' and then 
# uncomment all the nodes of the system.  The node count will need to
# match what is in the preconf.csv file. Copy the MAC addresses from 
# the system you wish to re-image in their correct spaces.  Do not 
# use the default values listed. Do NOT change Node Names.
#
# The format of a MAC should use a colon ':' as a separator as in the
# examples.  Any other character will cause an error.
#
# Your PXE Server does not need to be in the same network as the 
# current Exadata System to use this Mode.
#
# If doing an up-scale, you can uncomment the existing nodes but you 
# should leave the default MAC address.
#
# NEVER USE OR UPDATE THE ACTUAL MACs OF EXISTING HARDWARE WHICH WILL 
# NOT BE REIMAGED.
#
# NEVER REBOOT ANY NODES WHICH ARE NOT TO BE REIMAGED.
#

manualMac: 0

