#------------------ AutoImage 4.0 Configuration File ------------------#


[authentication] # ------------ Authentication Parameters ------------ #
# This is used for communicating with the Exadata ILOMs.  These should 
# only be changed if the default root account does not exist or if the 
# password is not Oracle's default.
# Note the same password must be on all ILOMs.

defaultUser: root
defaultPassword: welcome1

[directories] # -------------------- Directories --------------------- #
# Default directories and locations on the PXE Server. These should
# only ever be changed if the PXE software changes or they change on
# the Exadata machine. These should NOT be changed without fully
# understanding where all the associative software changes need to
# take place.

tftpbootDir: /tftpboot
MACAddressDir: /tftpboot/pxelinux.cfg
NFSDir: /u01/exadata_nfs
ISODir: /u01/exadata_nfs/iso
PreConfDir: /u01/exadata_nfs/config
ISOPreConfDir: /u01/exadata_nfs/iso
EFIExtractDir: /opt/AutoImage
EFIgrubDir: /tftpboot/efi


[images] # ------------------------- Images ---------------------------#
# Provide a list of "|" separated (cell_name,compute_name) pairs to designate 
# legitimate tags to be found in cell/compute image file names
# e.g.,
# nfsimg-12.2.1.1.0-170126.2-cell.tar
# nfsimg-12.2.1.1.0-170126.2-compute.tar

allowedTags:  cell,compute|DL180,DL360

[applications] # ------------------- Applications -------------------- #
# Default locations for the software on the AutoImage Guest.  You 
# should never need to change these if using AutoInstall.

ping: /bin/ping
dos2unix: /usr/bin/dos2unix
imageinfo: /usr/local/bin/imageinfo
extractefi: /opt/AutoImage/extract_efi_from_initrd.sh 

[templates] # ---------------------- Templates ----------------------- #
# Exadata Compute Node ovs= option
# ovs: yes    Image IB based system with bare metal (active) and DOM0.  Image  
#             RoCE based system with bare metal.  Note: RoCE based system can be
#             switched to KVM host later.
# ovs: no     Image IB based system with only bare metal.  For RoCE based system,
#             ovs=no is the same as ovs=yes.
# ovs: active Image IB based system with DOM0 (active) and bare metal.  For RoCE
#             based system ovs=active is the same as ovs=yes. 
# ovs: only   Image IB based system with only DOM0.  Image RoCE based system with  
#             automatic switch to KVM host.
#ovs: xxxx

[validations] # -------------------- Validations -------------------- #
# If you wish to skip any validation steps, just change the 0 to 1.
# 1 is on (and will be skipped) and 0 is off (default) and will be
# processed.  Default are all '0' (zero).

skipSetBootDevice: 0
skipSystemReboot: 0
skipSetCommandsSL6: 0
skipHostStorageDeviceStatus: 0

[keyfile] # ------------------------ Keyfile ------------------------ #
# Controls related to the use of keyfile.txt

# window of days for keyfile download reminder
keyfileDownloadMsgThreshold = 10

[timings] # ------------------------ Timings ------------------------ #
# The number of seconds between node reboots.  You may need to increase 
# this if you often have reimaging failures on some nodes due to bandwidth 
# issues.  You may need to change this to 180 or higher for Raspberry Pi 
# Installs due to USB Bandwidth constraints.  Default '60'

sleepSeconds: 60
sleepSecondsIPMI: 60 

# The number of seconds between system pings.  If you have problems with 
# how fast this runs, you can increase this value.  Default '1' (One 
# Second).

pingWait: 1

# SSH Timeout for connection to nodes.  If there are issues connecting 
# to the nodes during the SSH process, change this.  Default '10'.

sshTimeOut: 10

[imagingOrder] # ------------ Node Imaging Order -------------------- #
# New with AutoImage 21.0.7.0
# The default order for imaging nodes is database nodes first,
# with host commands grouped for each node.
# If the lagacy mode of imaging is prefered 
# (storage cells first - host commands not grouped),
# then set dbnodesFirst: 0
#dbnodesFirst: 0
dbnodesFirst: 1

[pi] # ----------------------- Raspberry Pi  ------------------------ #
# USB Device for Raspberry Pi AutoImage.  You should only need to 
# change this if the USB device during a Raspberry Pi reimaging is not 
# the default.  Default is '/dev/sda1'.  This is ignored if the system
# is not a Raspberry Pi.

usbDevice: /dev/sda1

[networking] # --------------------- Networking --------------------- #
# Ethernet Device for AutoImage to use for Imaging.  This should be set 
# to the device which which will be used for imaging.  If you have 
# built your AutoInstall from the instructions on the BackOffice Wiki,
# this should remain eth1.

EthernetDev: eth1

